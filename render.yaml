services:
  - type: web
    name: esp32-mic-relay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      # Render generates both of these for you on first deploy. Read them
      # from Dashboard -> your service -> Environment. The device token goes
      # in the sketch; the listen token is what you type on your phone.
      - key: DEVICE_TOKEN
        generateValue: true
      - key: LISTEN_TOKEN
        generateValue: true
